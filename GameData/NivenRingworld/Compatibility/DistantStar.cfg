// Optional host stars for the Ringworld configuration packs. No pack: no added star.
// Distances use a Julian light-year (9,460,730,472,580,800 m).
// Separate from ring physics. Kopernicus owns body registration and persistence.

@Kopernicus:AFTER[Kopernicus]:NEEDS[Kopernicus,NivenRingworldInterstellarStandard,!NivenRingworldInterstellarFullSize]
{
    Body
    {
        name = NivenRingworldHost
        Template
        {
            name = Sun
        }
        Properties
        {
            displayName = Niven's Star^N
            description = A yellow-white G2V-inspired ringworld host. The standard-size preset scales stellar properties for KSP gameplay. Keep its configuration pack installed when loading saves that use this star.
            radius = 69570000
            gravParameter = 1.32712440018e+18
            // Explicit gameplay SOI avoids engulfing the original Kerbol system.
            sphereOfInfluence = 10000000000000
            rotationPeriod = 2160000
        }
        ScaledVersion
        {
            type = Star
            Light
            {
                givesOffLight = true
                sunlightColor = 1,0.97,0.91,1
                scaledSunlightColor = 1,0.97,0.91,1
                IVASunColor = 1,0.97,0.91,1
                sunLensFlareColor = 1,0.97,0.91,1
                sunAU = 15300000000
                luminosity = 1721.29043591
                IntensityCurve
                {
                    key = 0 1 0 0
                    key = 30600000000 1 0 0
                    key = 10000000000000 0 0 0
                }
                ScaledIntensityCurve
                {
                    key = 0 1 0 0
                    key = 5100000 1 0 0
                    key = 1666666666.67 0 0 0
                }
                IVAIntensityCurve
                {
                    key = 0 1 0 0
                    key = 30600000000 1 0 0
                    key = 10000000000000 0 0 0
                }
            }
        }
        Orbit
        {
            referenceBody = Sun
            color = 1,0.95,0.75,1
            inclination = 0
            eccentricity = 0
            semiMajorAxis = 946073047258080
            longitudeOfAscendingNode = 0
            argumentOfPeriapsis = 0
            meanAnomalyAtEpoch = 0
            epoch = 0
        }
    }
}

